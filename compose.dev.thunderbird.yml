# Overlay: nimmt `thunderbird_hausverwaltung` in den Dev-Stack auf.
#
# Nicht Teil von compose.dev.yml, weil die App umgekehrt von hausverwaltung
# abhängt (required_apps = ["hausverwaltung"]) — ein Clone dieses Repos soll
# ohne sie startfähig sein.
#
# Verwendung:
#   HV_EXTRA=thunderbird ./dev.sh up
# oder direkt:
#   docker compose -f compose.dev.yml -f compose.dev.thunderbird.yml up -d
#
# Voraussetzung: ../thunderbird_hausverwaltung ist geklont.

x-tb-mount: &tb-mount
  volumes:
    - ../thunderbird_hausverwaltung:/home/frappe/frappe-bench/apps/thunderbird_hausverwaltung

x-tb-apps: &tb-apps
  HV_APPS: ${HV_APPS:-process_engine mail_merge hausverwaltung thunderbird_hausverwaltung}

services:
  configurator:
    <<: *tb-mount
    environment: *tb-apps
  create-site:
    <<: *tb-mount
    environment: *tb-apps
  backend:
    <<: *tb-mount
  frontend:
    <<: *tb-mount
  websocket:
    <<: *tb-mount
  queue-short:
    <<: *tb-mount
  queue-long:
    <<: *tb-mount
  scheduler:
    <<: *tb-mount
