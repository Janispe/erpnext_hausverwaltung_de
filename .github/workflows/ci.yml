name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Mietvertrag (Frappe v16)
    # Actions run only in the public repository. The private repository has no Actions budget;
    # agent PRs there are verified locally with scripts/agent_ci.sh.
    if: github.repository == 'Janispe/erpnext_hausverwaltung_de'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BENCH_PATH: /home/runner/frappe-bench
      FRAPPE_VERSION: v16.14.0
      ERPNEXT_VERSION: v16.14.0
      SITE_NAME: test_site
      # Disposable local service and site credentials for this job only.
      DB_ROOT_PASSWORD: ci-root
      SITE_ADMIN_PASSWORD: ci-admin
      HV_COMPANY: CI Hausverwaltung
      HV_BOOTSTRAP_CREATE_COA: '1'
      CYPRESS_INSTALL_BINARY: '0'

    services:
      redis-cache:
        image: redis:8-alpine
        ports:
          - '127.0.0.1:13000:6379'
      redis-queue:
        image: redis:8-alpine
        ports:
          - '127.0.0.1:11000:6379'
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
        ports:
          - '127.0.0.1:3306:3306'
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Check out Hausverwaltung
        uses: actions/checkout@v6
        with:
          path: hausverwaltung
          persist-credentials: false

      # These pinned app revisions must be publicly fetchable by the runner.
      - name: Check out Process Engine
        uses: actions/checkout@v6
        with:
          repository: Janispe/process_engine
          ref: 9546be8c2443596d3a60e7b8a12bf01f182a8f4a
          path: process_engine
          persist-credentials: false

      - name: Check out Mail Merge
        uses: actions/checkout@v6
        with:
          repository: Janispe/erp_next_mail_merge
          ref: 134adc792d478147bf64d90f36fde5a1bc3206ff
          path: mail_merge
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client libmariadb-dev pkg-config libpango-1.0-0 libpangoft2-1.0-0

      - name: Initialize Bench
        run: |
          python -m pip install frappe-bench==5.31.1
          bench init --frappe-branch "$FRAPPE_VERSION" --skip-redis-config-generation \
            --skip-assets --python "$(command -v python)" "$BENCH_PATH"
          MYSQL_PWD="$DB_ROOT_PASSWORD" mariadb --host 127.0.0.1 --user root --execute \
            "SET GLOBAL character_set_server = 'utf8mb4';
             SET GLOBAL collation_server = 'utf8mb4_unicode_ci';
             SET GLOBAL innodb_snapshot_isolation = OFF;"

      - name: Install apps and create test site
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          bench get-app --skip-assets --branch "$ERPNEXT_VERSION" https://github.com/frappe/erpnext.git
          bench get-app --skip-assets "$GITHUB_WORKSPACE/process_engine"
          bench get-app --skip-assets "$GITHUB_WORKSPACE/mail_merge"
          bench get-app --skip-assets "$GITHUB_WORKSPACE/hausverwaltung"
          bench setup requirements --dev
          bench new-site --db-host 127.0.0.1 --mariadb-user-host-login-scope='%' \
            --db-root-password "$DB_ROOT_PASSWORD" --admin-password "$SITE_ADMIN_PASSWORD" \
            --install-app erpnext --install-app process_engine --install-app mail_merge \
            --install-app hausverwaltung "$SITE_NAME"
          bench --site "$SITE_NAME" migrate
          bench build

      - name: Run Mietvertrag database tests
        working-directory: ${{ env.BENCH_PATH }}
        run: |
          bench --site "$SITE_NAME" set-config --parse allow_tests 1
          bench --site "$SITE_NAME" run-tests --app hausverwaltung \
            --module hausverwaltung.hausverwaltung.doctype.mietvertrag.test_mietvertrag \
            --case TestMietvertragDatabaseIntegration
