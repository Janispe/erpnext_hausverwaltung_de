# Devcontainer-Stack für die App `hausverwaltung`.
#
# Vollständig eigenständig: braucht nur dieses Repo und Docker. Keine
# Nachbar-Clones, keine externe compose, nichts aus einer bestehenden
# Arbeitsumgebung. Die beiden required_apps holt sich der Container beim
# ersten Start selbst von GitHub (siehe setup.sh).
#
# Eigener Projektname => eigene Volumes. Kann mit keinem anderen Stack
# kollidieren, auch nicht mit compose.dev.yml (Projekt `hv-dev`).

name: hv-devcontainer

services:
  frappe:
    # Dasselbe Image wie der Produktivpfad: enthält die Chromium-Bibliotheken
    # für die PDF-Engine. Der Bench (frappe + erpnext) steckt schon drin,
    # ein `bench init` ist deshalb nicht nötig.
    image: hausverwaltung/frappe-chrome:devcontainer
    build:
      context: ..
      dockerfile: docker/frappe-chrome.Dockerfile
      args:
        FRAPPE_BASE_IMAGE: ${FRAPPE_BASE_IMAGE:-frappe/erpnext:v16.14.0}
    command: sleep infinity
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    volumes:
      # Sites überleben ein Rebuild des Containers.
      - sites:/home/frappe/frappe-bench/sites
      # Dieses Repo wird an seinen Platz im Bench gemountet — Änderungen im
      # Editor sind sofort im Bench sichtbar.
      - ..:/home/frappe/frappe-bench/apps/hausverwaltung:cached
    environment:
      SHELL: /bin/bash
      HV_SITE: ${HV_SITE:-dev}
      HV_COMPANY: ${HV_COMPANY:-Demo Hausverwaltung}
      HV_LANGUAGE: ${HV_LANGUAGE:-de}
      HV_TIME_ZONE: ${HV_TIME_ZONE:-Europe/Berlin}
      HV_COUNTRY: ${HV_COUNTRY:-Germany}
      HV_CURRENCY: ${HV_CURRENCY:-EUR}
      HV_COA_TEMPLATE: ${HV_COA_TEMPLATE:-SKR03 mit Kontonummern}
      HV_BOOTSTRAP_CREATE_COA: ${HV_BOOTSTRAP_CREATE_COA:-1}
      HV_BOOTSTRAP_RUN_SETUP_WIZARD: "0"
      HV_BOOTSTRAP_MARK_SETUP_COMPLETE: "1"
    ports:
      # 8200/9200 statt 8000/9000: 8000 ist auf Entwicklerrechnern gern von
      # Paperless belegt. An 127.0.0.1 gebunden, also nicht von außen sichtbar.
      - "127.0.0.1:8200:8000"
      - "127.0.0.1:9200:9000"

  mariadb:
    image: mariadb:10.6
    healthcheck:
      test: mysqladmin ping -h localhost --password=admin
      interval: 2s
      retries: 30
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine

  redis-queue:
    image: redis:6.2-alpine

volumes:
  sites:
  mariadb-data:
