version: 1.3.13
cache: true
interface:
  customWelcome: "Hausverwaltung – ERPNext, Mail-Archiv und Dateien"
  fileSearch: false
  contextCost: true
  # Mistral-Kurs aus der EUR-Preisanzeige: 1.19 EUR / 1.40 USD
  currency: { code: EUR, rate: 0.85 }
  agents:
    use: true
    create: true
    share: false
    public: false
endpoints:
  agents:
    recursionLimit: 25
    maxRecursionLimit: 50
    capabilities: [tools, execute_code, programmatic_tools]
  custom:
    - name: Mistral
      apiKey: "${MISTRAL_API_KEY}"
      baseURL: "${MISTRAL_BASE_URL}"
      models:
        default: [mistral-small-latest, mistral-large-latest, zai-glm-5-3, zai-glm-5-2]
        fetch: false
      titleConvo: false
      modelDisplayLabel: Mistral
      # USD pro 1 Mio. Tokens laut docs.mistral.ai/models/zai-glm-5-3 (Stand 17.09.2026)
      tokenConfig:
        zai-glm-5-3: { prompt: 1.4, completion: 4.4, cacheRead: 0.14, context: 128000 }
      dropParams: [stop, user, frequency_penalty, presence_penalty]
mcpSettings:
  allowedDomains: [hvp-frontend-1, mail-mcp]
  allowedAddresses: ["hvp-frontend-1:8080", "mail-mcp:9557"]
mcpServers:
  fac:
    startup: true
    type: streamable-http
    title: FAC
    url: http://hvp-frontend-1:8080/api/method/frappe_assistant_core.api.fac_endpoint.handle_mcp
    headers:
      Authorization: "${FAC_AUTH_HEADER}"
    timeout: 30000
    initTimeout: 15000
    requiresOAuth: false
    serverInstructions: true
    chatMenu: false
  mail:
    startup: true
    type: streamable-http
    title: Mail Archiv
    description: Stalwart-Archiv archiv@archiv.test, nur lesend freigegeben
    url: http://mail-mcp:9557/mcp
    timeout: 60000
    initTimeout: 15000
    requiresOAuth: false
    serverInstructions: true
    chatMenu: false

modelSpecs:
  # Only the combined profile is offered. The other test agents still exist in
  # MongoDB; to show them again, add their entries back to this list:
  #   FAC Original · Mistral       agent_jRT3dZxvRUnS4d7hzcynS  mistral-small-latest
  #   FAC · GLM 5.3 (via Mistral)  agent_cIxrF57xiSjQbrvgXI0du  zai-glm-5-3
  #   Mail Archiv · GLM 5.3        agent_YqBfG6kqQOXyVV0643SJN  zai-glm-5-3
  enforce: true
  prioritize: true
  list:
    # Beide Agenten sind bis auf model_parameters.reasoning_effort identisch
    # (GLM 5.3 kennt nur low/high/max). Anweisungen/Werkzeuge bei Änderungen abgleichen.
    - name: hausverwaltung-glm-5-3
      label: "Hausverwaltung · gründlich"
      description: "GLM 5.3, reasoning_effort high – für Auswertungen und knifflige Fragen"
      default: true
      preset:
        endpoint: agents
        agent_id: agent_8_rATI1CoiMyvAoMxEldg
        model: zai-glm-5-3
    - name: hausverwaltung-glm-5-3-schnell
      label: "Hausverwaltung · schnell"
      description: "GLM 5.3, reasoning_effort low – schneller und günstiger"
      preset:
        endpoint: agents
        agent_id: agent_gywymW99VZXaqbhwNc8bk
        model: zai-glm-5-3
